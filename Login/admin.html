<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Service Portal Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }

    .split-left, .split-right {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .split-left {
      background-color: #e4e4e4;
      color: white;
      padding: 2rem;
    }

    .split-right {
      background-color: #ffffff;
      padding: 3rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .login-box {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      
    }

    .login-box h2 {
      margin-bottom: 1rem;
      font-size: 1.6rem;
      color: #007bff;
      text-align: center;
    }

    .form-control {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 0.8rem;
      color: #333;
      font-size: 1rem;
      margin-bottom: 1rem;
      width: 100%;
    }

    .form-control:focus {
      border-color: #007bff;
      outline: none;
    }

    .form-control::placeholder {
      color: #999;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      color: white;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .form-check-label, .forgot-password {
      color: #666;
      font-size: 0.9rem;
    }

    .forgot-password {
      text-align: right;
      display: block;
      margin-top: 1rem;
    }

    .forgot-password a {
      color: #007bff;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .split-left, .split-right {
        flex: 1 1 100%;
        height: auto;
      }
      .login-box {
        max-width: 100%;
        padding: 1.5rem;
      }
    }
</style>

</head>
<body>
  <div class="container-fluid h-100">
    <div class="row h-100">
      
      <!-- Left side (Dark) -->
      <div class="col-md-6 split-left text-center">
        <div>
          <img src="https://zen-tech-student-portal.vercel.app/Student's%20Portal!.png" alt="T-Service Logo" class="img-fluid" style="max-height: 350px;">
        
        </div>
      </div>
<!-- Right side (Light login form) -->
<div class="col-md-6 split-right">
  <div class="login-box">
    <h3 class="text-center mb-3">Admin Login</h3>

    <form id="login-form">
      <div class="mb-3">
        <label for="studentId" class="form-label">Username / Email</label>
        <input type="email" class="form-control" id="studentId" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <a href="#" class="forgot-password">Student Login</a>
        </div>
        <a href="#" class="forgot-password">Faculty Login</a>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-4 text-muted" style="font-size: 0.9rem;">&copy; 2025 - Zen-Tech ERP Software</p>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  // Import Firebase modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBamOshyQYvYAyUfJ497n6TAwfjTJQmT7o",
    authDomain: "zen-tech-erp.firebaseapp.com",
    projectId: "zen-tech-erp",
    storageBucket: "zen-tech-erp.appspot.com", // Fixed typo: should be appspot.com
    messagingSenderId: "16450878114",
    appId: "1:16450878114:web:47adbeeca3833f572bf5fb",
    measurementId: "G-2B2QFSVFRF"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const analytics = getAnalytics(app);

  // Login form handler
  const loginForm = document.getElementById('login-form');
  loginForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    const email = document.getElementById('studentId').value;
    const password = document.getElementById('password').value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      alert("Login successful!");

      // Role-based redirection (You can enhance with Firestore later)
      if (user.email === "admin@zentech.org") {
        window.location.href = "/admin-dashboard"; // Replace with actual URL
      } else {
        window.location.href = "/user-dashboard"; // Replace with actual URL
      }
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  });
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
